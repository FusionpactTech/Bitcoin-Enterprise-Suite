version: '3.8'

services:
  # Development environment
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target-cache:/app/target
    working_dir: /app
    command: /bin/bash
    environment:
      - RUST_LOG=debug
      - CARGO_TERM_COLOR=always
    networks:
      - bitcoin-enterprise

  # Security scanning service
  security-scan:
    build:
      context: .
      dockerfile: Dockerfile
      target: security-scanner
    volumes:
      - .:/app:ro
    working_dir: /app
    command: ["sh", "-c", "cargo audit && cargo deny check"]
    networks:
      - bitcoin-enterprise

  # Runtime environment
  runtime:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      - RUST_LOG=info
    networks:
      - bitcoin-enterprise
    restart: unless-stopped

  # Trivy vulnerability scanner
  trivy:
    image: aquasec/trivy:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - trivy-cache:/root/.cache/
    command: ["image", "--severity", "HIGH,CRITICAL", "bitcoin-enterprise-suite:latest"]
    networks:
      - bitcoin-enterprise

networks:
  bitcoin-enterprise:
    driver: bridge

volumes:
  cargo-cache:
  cargo-git:
  target-cache:
  trivy-cache: