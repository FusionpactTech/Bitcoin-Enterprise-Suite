# Configuration for cargo-deny (updated to current schema)
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Restrict checks to common targets used by this project
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Use defaults; manage ignores explicitly
ignore = []
# git-fetch-with-cli = true

[licenses]
# Explicitly allowed SPDX licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.8
exceptions = [
    { allow = ["Apache-2.0", "MIT"], crate = "r-efi@5.3.0", reason = "LGPL-2.1-or-later is an OR option; project consumes via permissive terms only" }
]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # Deny crates that are known to be problematic for Bitcoin/crypto
    "openssl",
    "openssl-sys",
]
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []